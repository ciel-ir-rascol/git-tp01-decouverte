<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" font-family="Ubuntu, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d9661f"/>
    </marker>
    <marker id="fb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0b4f6c"/>
    </marker>
  </defs>

  <!-- Zones -->
  <rect x="8" y="40" width="802" height="300" rx="14" fill="none" stroke="#52606d" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="24" y="30" font-size="20" font-weight="700" fill="#52606d">MON POSTE (local)</text>
  <rect x="850" y="40" width="302" height="300" rx="14" fill="none" stroke="#52606d" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="866" y="30" font-size="20" font-weight="700" fill="#52606d">INTERNET (distant)</text>

  <!-- Boites -->
  <g font-size="21" text-anchor="middle">
    <rect x="30" y="130" width="230" height="150" rx="10" fill="#e6f0f4" stroke="#0b4f6c" stroke-width="2.5"/>
    <text x="145" y="175" font-weight="700" fill="#0b4f6c">Répertoire</text>
    <text x="145" y="200" font-weight="700" fill="#0b4f6c">de travail</text>
    <text x="145" y="235" font-size="16" fill="#1f2933">les fichiers que</text>
    <text x="145" y="256" font-size="16" fill="#1f2933">je modifie</text>

    <rect x="305" y="130" width="230" height="150" rx="10" fill="#e6f0f4" stroke="#0b4f6c" stroke-width="2.5"/>
    <text x="420" y="175" font-weight="700" fill="#0b4f6c">Zone de</text>
    <text x="420" y="200" font-weight="700" fill="#0b4f6c">préparation</text>
    <text x="420" y="235" font-size="16" fill="#1f2933">(staging / index)</text>
    <text x="420" y="256" font-size="16" fill="#1f2933">le prochain commit</text>

    <rect x="580" y="130" width="210" height="150" rx="10" fill="#0b4f6c" stroke="#0b4f6c" stroke-width="2.5"/>
    <text x="685" y="175" font-weight="700" fill="#ffffff">Dépôt local</text>
    <text x="685" y="200" font-family="'Ubuntu Mono', monospace" fill="#ffd2b0">.git/</text>
    <text x="685" y="235" font-size="16" fill="#e6f0f4">l'historique</text>
    <text x="685" y="256" font-size="16" fill="#e6f0f4">des commits</text>

    <rect x="880" y="130" width="250" height="150" rx="10" fill="#1f2933" stroke="#1f2933" stroke-width="2.5"/>
    <text x="1005" y="175" font-weight="700" fill="#ffffff">Dépôt distant</text>
    <text x="1005" y="200" fill="#ffd2b0">GitHub</text>
    <text x="1005" y="235" font-size="16" fill="#e6f0f4">copie partagée</text>
    <text x="1005" y="256" font-size="16" fill="#e6f0f4">et sauvegardée</text>
  </g>

  <!-- Etape 0 : je code -->
  <g text-anchor="middle">
    <circle cx="145" cy="80" r="17" fill="#d9661f"/>
    <text x="145" y="87" font-size="20" font-weight="700" fill="#fff">1</text>
    <text x="145" y="114" font-size="17" fill="#1f2933">je code</text>
  </g>

  <!-- Fleches vers la droite -->
  <g font-size="20" font-weight="700" text-anchor="middle" fill="#d9661f">
    <line x1="262" y1="190" x2="300" y2="190" stroke="#d9661f" stroke-width="4" marker-end="url(#fl)"/>
    <line x1="537" y1="190" x2="575" y2="190" stroke="#d9661f" stroke-width="4" marker-end="url(#fl)"/>
    <line x1="792" y1="190" x2="875" y2="190" stroke="#d9661f" stroke-width="4" marker-end="url(#fl)"/>

    <circle cx="282" cy="80" r="17" fill="#d9661f"/>
    <text x="282" y="87" fill="#fff">2</text>
    <text x="282" y="114" font-family="'Ubuntu Mono', monospace">git add</text>

    <circle cx="557" cy="80" r="17" fill="#d9661f"/>
    <text x="557" y="87" fill="#fff">3</text>
    <text x="557" y="114" font-family="'Ubuntu Mono', monospace">git commit</text>

    <circle cx="833" cy="80" r="17" fill="#d9661f"/>
    <text x="833" y="87" fill="#fff">4</text>
    <text x="833" y="114" font-family="'Ubuntu Mono', monospace">git push</text>
  </g>

  <!-- Retour : pull / clone -->
  <path d="M1005,282 L1005,380 L145,380 L145,286" fill="none" stroke="#0b4f6c" stroke-width="4" marker-end="url(#fb)"/>
  <text x="575" y="372" font-size="20" font-weight="700" text-anchor="middle" fill="#0b4f6c"><tspan font-family="'Ubuntu Mono', monospace">git pull</tspan>  (et <tspan font-family="'Ubuntu Mono', monospace">git clone</tspan> la toute première fois)</text>
  <text x="575" y="415" font-size="17" text-anchor="middle" fill="#52606d">récupérer le travail des autres (ou le mien, depuis un autre poste)</text>
</svg>
